<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huquq Test Pro — Admin Test Boshqaruvi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef2ff;font-family:Inter,system-ui,Arial}.shell{display:flex;min-height:100vh}.side{width:240px;background:#0c111d;border-right:1px solid #22304a;padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:900;padding:5px 10px 28px}.brand span{color:#a487ff}.nav{width:100%;border:0;background:none;color:#96a2bd;text-align:left;padding:12px 14px;border-radius:11px;margin:4px 0;cursor:pointer}.nav.active,.nav:hover{background:#181f35;color:#fff}.main{margin-left:240px;padding:28px;width:calc(100% - 240px);max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}h1{font-size:29px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}.muted{color:#8d99b5;font-size:13px}.btn{border:1px solid #303958;background:#151d31;color:#edf2ff;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#7968ff,#a35cff)}.danger{background:#2a1720;border-color:#67384c;color:#ffb3c0}.green{background:#153126;border-color:#2f5c49;color:#92edbd}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1.25fr .9fr;gap:16px}.card{background:#10182a;border:1px solid #22304a;border-radius:17px;padding:18px;margin-bottom:17px;box-shadow:0 15px 45px #0004}.metric{font-size:24px;font-weight:850;margin-top:5px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:960px}.table th,.table td{padding:12px;border-bottom:1px solid #222b45;text-align:left}.table th{font-size:11px;color:#7e89a5}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#1c2440;color:#c0b8ff;font-size:11px}.badge.good{background:#173126;color:#91eabd}.badge.bad{background:#301d27;color:#ff9db4}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.field{margin-bottom:12px}label{display:block;font-size:11px;color:#aeb8d2;margin-bottom:6px}input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #293451;background:#0a1020;color:#eef2ff}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#11182a;border:1px solid #303957;border-radius:18px;padding:22px}
@media(max-width:950px){.side{display:none}.main{margin:0;width:100%;padding:16px}.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div>
<script>
const api=(u,o={})=>fetch(u,{headers:{"Content-Type":"application/json"},...o}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Xatolik");return d});
function shell(content,active="tests"){document.getElementById("app").innerHTML=`<div class="shell"><aside class="side"><div class="brand">Huquq Test <span>Pro</span></div>
<button class="nav">🏠 Dashboard</button><button class="nav active">📝 Testlar</button><button class="nav">📚 Savollar bazasi</button><button class="nav">👨‍🎓 O‘quvchilar</button><button class="nav">🟢 Jonli nazorat</button><button class="nav">🏆 Reyting</button><button class="nav">📊 Statistika</button></aside><main class="main">${content}</main></div>`}
async function load(){
  const m=await api('/api/me'); if(!m.user||m.user.role!=='admin'){location.href='/';return}
  const tests=await api('/api/admin/tests');
  shell(`<div class="top"><div><h1>📝 Testlarni boshqarish</h1><div class="muted">Yaratish, nashr qilish, vaqtini boshqarish, urinishlarni ko‘rish va testni yopish.</div></div><button class="btn primary" onclick="newTest()">＋ Yangi test</button></div>
  <div class="grid"><div class="card">Jami testlar<div class="metric">${tests.length}</div></div><div class="card">Nashr qilingan<div class="metric">${tests.filter(x=>x.published).length}</div></div><div class="card">Admin tasdig‘i<div class="metric">${tests.filter(x=>x.result_mode==='approval').length}</div></div><div class="card">Savollar<div class="metric">${tests.reduce((a,x)=>a+Number(x.question_count||0),0)}</div></div></div>
  <div class="card"><div class="toolbar"><input id="search" placeholder="🔎 Test qidirish" oninput="filterTests()" style="max-width:300px"><button class="btn" onclick="load()">↻ Yangilash</button></div><div id="tbl" class="tablewrap" style="margin-top:13px"></div></div>`);window.tests=tests;render(tests)
}
function render(rows){document.getElementById('tbl').innerHTML=`<table class="table"><thead><tr><th>TEST</th><th>SAVOLLAR</th><th>MAX BALL</th><th>VAQT</th><th>NATIJA</th><th>HOLAT</th><th>AMAL</th></tr></thead><tbody>${rows.map(t=>`<tr><td><b>${esc(t.title)}</b><div class="muted">${new Date(t.created_at).toLocaleString('uz-UZ')}</div></td><td>${t.question_count}</td><td>${t.max_score}</td><td>${t.duration_seconds?Math.round(t.duration_seconds/60)+' min':'∞'}</td><td><span class="badge">${t.result_mode==='approval'?'Admin tasdig‘i':'Darhol'}</span></td><td><span class="badge ${t.published?'good':'bad'}">${t.published?'Nashr qilingan':'Yopiq'}</span></td><td><button class="btn" onclick="manage(${t.id})">Boshqarish</button> <button class="btn danger" onclick="delTest(${t.id})">O‘chirish</button></td></tr>`).join('')}</tbody></table>`}
function filterTests(){const q=document.getElementById('search').value.toLowerCase();render(window.tests.filter(x=>x.title.toLowerCase().includes(q)))}
async function manage(id){const tests=await api('/api/admin/tests');const t=tests.find(x=>x.id===id);const attempts=await api(`/api/admin/tests/${id}/attempts`);shell(`<div class="top"><div><h1>${esc(t.title)}</h1><div class="muted">${t.question_count} savol · maksimal ${t.max_score} ball</div></div><button class="btn" onclick="load()">← Testlar</button></div>
<div class="grid"><div class="card">Holat<div class="metric">${t.published?'Nashr qilingan':'Yopiq'}</div></div><div class="card">Urinishlar<div class="metric">${attempts.length}</div></div><div class="card">Vaqt<div class="metric">${t.duration_seconds?Math.round(t.duration_seconds/60)+' min':'∞'}</div></div><div class="card">Natija<div class="metric">${t.result_mode==='approval'?'Tasdiq':'Darhol'}</div></div></div>
<div class="grid2"><div class="card"><h2>⚙️ Test sozlamalari</h2><div class="field"><label>NOM</label><input id="mt" value="${esc(t.title)}"></div><div class="field"><label>VAQT (DAQIQA)</label><input id="md" type="number" value="${t.duration_seconds?Math.round(t.duration_seconds/60):''}"></div><div class="field"><label>URINISH LIMITI</label><input id="mm" type="number" value="${t.max_attempts||''}"></div><div class="field"><label>NATIJA</label><select id="mr"><option value="immediate" ${t.result_mode==='immediate'?'selected':''}>Darhol</option><option value="approval" ${t.result_mode==='approval'?'selected':''}>Admin tasdiqlagandan keyin</option></select></div><div class="toolbar"><button class="btn primary" onclick="saveTest(${id})">Saqlash</button>${t.published?'<button class="btn danger" onclick="closeTest('+id+')">Testni yopish</button>':'<button class="btn green" onclick="reopenTest('+id+')">Testni ochish</button>'}<button class="btn" onclick="manageQuestions(${id})">Savollarni boshqarish</button></div></div>
<div class="card"><h2>👥 Urinishlar</h2><div class="tablewrap"><table class="table" style="min-width:600px"><thead><tr><th>O‘QUVCHI</th><th>BALL</th><th>TO‘G‘RI</th><th>HOLAT</th></tr></thead><tbody>${attempts.map(a=>`<tr><td>${esc(a.full_name)}</td><td>${a.score}/${a.max_score}</td><td>${a.correct_count}</td><td><span class="badge">${a.status}</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Hali urinish yo‘q</td></tr>'}</tbody></table></div></div></div>`)}
async function saveTest(id){await api(`/api/admin/tests/${id}`,{method:'PATCH',body:JSON.stringify({title:document.getElementById('mt').value,duration_seconds:Number(document.getElementById('md').value||0)*60||null,max_attempts:Number(document.getElementById('mm').value)||null,result_mode:document.getElementById('mr').value})});manage(id)}
async function closeTest(id){if(confirm('Test hozir yopilsinmi?')){await api(`/api/admin/tests/${id}/close`,{method:'POST'});manage(id)}}
async function reopenTest(id){await api(`/api/admin/tests/${id}/reopen`,{method:'POST',body:JSON.stringify({ends_at:null})});manage(id)}
async function delTest(id){if(confirm('Test, savollari va urinishlari o‘chiriladi. Davom etilsinmi?')){await api(`/api/admin/tests/${id}`,{method:'DELETE'});load()}}
function newTest(){shell(`<div class="card"><h1>Yangi test</h1><div class="field"><label>NOM</label><input id="nt" value="Yangi test"></div><div class="field"><label>VAQT (DAQIQA)</label><input id="nd" type="number" value="30"></div><div class="field"><label>URINISHLAR LIMITI</label><input id="nm" type="number" value="1"></div><div class="field"><label>NATIJA</label><select id="nr"><option value="immediate">Darhol</option><option value="approval">Admin tasdig‘idan keyin</option></select></div><div class="toolbar"><button class="btn" onclick="load()">Bekor qilish</button><button class="btn primary" onclick="create()">Testni yaratish</button></div></div>`)}
async function create(){const d=await api('/api/admin/tests',{method:'POST',body:JSON.stringify({title:document.getElementById('nt').value,duration_seconds:Number(document.getElementById('nd').value)*60,max_attempts:Number(document.getElementById('nm').value)||null,result_mode:document.getElementById('nr').value,published:false})});manage(d.id)}
async function manageQuestions(id){const ts=await api('/api/admin/tests');const t=ts.find(x=>x.id===id);shell(`<div class="top"><div><h1>📚 ${esc(t.title)} — savollar</h1><div class="muted">Savol qo‘shish va import qilish bu yerda bo‘ladi.</div></div><button class="btn" onclick="manage(${id})">← Testga qaytish</button></div><div class="card"><p class="muted">Keyingi bosqich: savol konstruktori bilan to‘liq integratsiya.</p><button class="btn primary" onclick="manage(${id})">Test sozlamalari</button></div>`)}
function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
load();
</script></body></html>
